[workspace]
resolver = "2"
members = ["cli", "crates/proto", "crates/nip98", "crates/core", "crates/fakes", "crates/devstack", "crates/e2e", "crates/templates", "xtask"]
# cell/ builds for wasm32 with worker-build.
exclude = ["cell"]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
strip = true

# RSA keys are made by the OpenID Connect fake (dev, the e2e) and oidc.rs's
# tests: its bignums unoptimized make one in seconds, not milliseconds.
[profile.dev.package.num-bigint-dig]
opt-level = 3
