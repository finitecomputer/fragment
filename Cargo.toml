[workspace]
resolver = "2"
members = ["cli", "crates/proto", "crates/nip98", "crates/core", "crates/fakes", "crates/devstack", "crates/e2e", "crates/templates", "xtask"]
# cell/ builds for wasm32 with worker-build.
exclude = ["cell"]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
strip = true

# RSA key generation (the OpenID Connect fake's keys in `cargo xtask dev`,
# core's and the fakes' tests) takes seconds unoptimised: these two alone
# are built optimised in the dev profile.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
