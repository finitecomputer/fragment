name: release
# The CLI's binary releases, two ways in:
#
# - Production's deploy (ci.yml, `cli-plan` then `cli-release`): after a
#   green deploy of `production` whose CLI code is not the latest
#   release's (`cargo xtask cli plan`, xtask/src/cli.rs), ci.yml calls this
#   with the next version's tag and the deployed commit. The tag must be
#   new: the release makes it, at that commit.
# - By hand: push a tag v<version> and this builds the tag's commit.
#   Hand-written release notes can live in a draft release created before
#   tagging; if none exists the workflow falls back to --generate-notes.
#
# Either way it publishes the release as the latest, and each binary says
# the tag's version (`fragment --version`, its User-Agent: built in from
# FRAGMENT_CLI_VERSION, cli/src/main.rs `VERSION`), which the build checks.
# Each tarball is fragment-<uname -s>-<uname -m>.tar.gz holding one binary,
# `fragment`, so the one-line install (cli/SKILL.md) fetches
# releases/latest/download/fragment-$(uname -s)-$(uname -m).tar.gz;
# `cargo xtask check` holds the matrix and that command to each other.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "the release's tag, v<version>, which no tag holds yet"
        type: string
        required: true
      sha:
        description: the commit the tag is made at, and every binary built from
        type: string
        required: true

permissions:
  contents: write

env:
  # the caller's, or the pushed tag's
  TAG: ${{ inputs.tag || github.ref_name }}
  SHA: ${{ inputs.sha || github.sha }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: Darwin-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            asset: Darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: Linux-x86_64
          # built on an arm64 runner: ring's C needs aarch64-linux-musl-gcc,
          # which its musl-tools has
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: Linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      # the deployed commit when called; the pushed tag's otherwise (empty,
      # checkout's default)
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is no release's tag: v<major>.<minor>.<patch>"; exit 1; }
          FRAGMENT_CLI_VERSION="${TAG#v}" cargo build --release -p fragment-cli --target ${{ matrix.target }}
      # each binary says the tag's version; macOS's x86_64 one runs under
      # Rosetta on the arm64 runner, installed when it is not there
      - name: version
        run: |
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          said=$("target/${{ matrix.target }}/release/fragment" --version)
          [ "$said" = "fragment ${TAG#v}" ] || { echo "::error::the binary says \"$said\", not fragment ${TAG#v}"; exit 1; }
      - name: package
        # macOS's tar adds no AppleDouble `._fragment` beside the binary
        env:
          COPYFILE_DISABLE: 1
        run: tar -czf "$RUNNER_TEMP/fragment-${{ matrix.asset }}.tar.gz" -C "target/${{ matrix.target }}/release" fragment
      # a build run again (re-running ci.yml's cli-plan runs these again,
      # in the same run) replaces its own artifact
      - uses: actions/upload-artifact@v4
        with:
          name: fragment-${{ matrix.asset }}
          path: ${{ runner.temp }}/fragment-${{ matrix.asset }}.tar.gz
          retention-days: 7
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-latest
    # one release at a time, a hand tag's or a deploy's
    concurrency:
      group: cli-release
      cancel-in-progress: false
    steps:
      # the builds' artifacts alone: called, this is ci.yml's run, whose
      # own artifacts (tested-tree-*, a failed shard's e2e-scratch-*, which
      # holds directories) are never a release's assets
      - uses: actions/download-artifact@v4
        with:
          pattern: fragment-*
          path: dist
          merge-multiple: true
      - name: attach
        env:
          GH_TOKEN: ${{ github.token }}
          # set when production's deploy called: its tag is new, made here
          CALLED_TAG: ${{ inputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # exactly the four tarballs the install fetches, each of
          # `fragment` alone, or nothing is published; uploaded by name
          assets=(dist/fragment-Darwin-arm64.tar.gz dist/fragment-Darwin-x86_64.tar.gz dist/fragment-Linux-x86_64.tar.gz dist/fragment-Linux-aarch64.tar.gz)
          found=$(find dist -mindepth 1 | sort)
          if [ "$found" != "$(printf '%s\n' "${assets[@]}" | sort)" ]; then
            echo "::error::dist holds ${found//$'\n'/ }, not the four tarballs, so nothing is published"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            [ "$(tar -tzf "$asset")" = fragment ] || { echo "::error::$asset is not a tarball of fragment alone, so nothing is published"; exit 1; }
          done
          notes=() target=()
          if [ -n "$CALLED_TAG" ]; then
            # never another release's tag: one taken since the plan (a hand
            # tag) means planning again
            if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>&1); then
              echo "::error::$TAG exists already, so nothing is published for $SHA: re-run this run's cli-plan job, which plans the next version (the deploy does not run again)"
              exit 1
            elif ! grep -q "HTTP 404" <<< "$out"; then
              echo "::error::cannot tell whether $TAG exists, so nothing is published: $out"
              exit 1
            fi
            notes=(--notes "The CLI of production's deploy of $SHA ($RUN_URL).") target=(--target "$SHA")
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" "${target[@]}" \
              --title "fragment $TAG" --generate-notes "${notes[@]}"
          fi
          # published, and the latest: the install command fetches from releases/latest
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${target[@]}" --draft=false --latest
          if [ -n "$CALLED_TAG" ]; then
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            [ "$tagged" = "$SHA" ] || { echo "::error::$TAG is at $tagged, not $SHA, which its binaries were built from"; exit 1; }
          fi
