name: release
# Binary releases: ci.yml calls this before production deploys new CLI
# inputs, with the next version's tag and commit, or push
# a v* tag by hand. CI builds the tarballs, attaches them, and publishes
# the release as the latest. Each tarball is
# fragment-<uname -s>-<uname -m>.tar.gz holding one binary, `fragment`, so
# the one-line install (cli/SKILL.md) fetches
# releases/latest/download/fragment-$(uname -s)-$(uname -m).tar.gz;
# `cargo xtask check` holds the matrix and that command to each other.
# Hand-written release notes can live in a draft release created before
# tagging; if none exists the workflow falls back to --generate-notes.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      sha:
        type: string
        required: true
    outputs:
      version:
        description: Published and verified CLI version
        value: ${{ jobs.release.outputs.version }}

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: Darwin-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            asset: Darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: Linux-x86_64
          # built on an arm64 runner: ring's C needs aarch64-linux-musl-gcc,
          # which its musl-tools has
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: Linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # the tag's version, which `fragment --version` and its User-Agent say
      - run: echo "FRAGMENT_CLI_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: build
        run: cargo build --locked --release -p fragment-cli --target ${{ matrix.target }}
      # each binary this runner can run (x86_64 macOS's would need Rosetta)
      - name: version
        if: matrix.target != 'x86_64-apple-darwin'
        run: test "$(target/${{ matrix.target }}/release/fragment --version)" = "fragment $FRAGMENT_CLI_VERSION"
      - name: package
        # macOS's tar adds no AppleDouble `._fragment` beside the binary
        env:
          COPYFILE_DISABLE: 1
        run: tar -czf "$RUNNER_TEMP/fragment-${{ matrix.asset }}.tar.gz" -C "target/${{ matrix.target }}/release" fragment
      - uses: actions/upload-artifact@v4
        with:
          name: fragment-${{ matrix.asset }}
          path: ${{ runner.temp }}/fragment-${{ matrix.asset }}.tar.gz
          retention-days: 7
          # a rerun replaces its artifact
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verified.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      # called, this is ci.yml's run, whose own artifacts (tested-tree-*,
      # e2e-scratch-*) are not the release's
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fragment-*
          merge-multiple: true
      - name: attach
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          assets=(dist/fragment-{Darwin-arm64,Darwin-x86_64,Linux-x86_64,Linux-aarch64}.tar.gz)
          repo=(--repo "$GITHUB_REPOSITORY")
          target=()
          if [ -n "$SHA" ]; then
            # called: the tag is new, made at the approved production commit
            if tag_error=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>&1); then
              echo "::error::$TAG already exists: nothing published (production may still deploy)"
              exit 1
            fi
            # Only a definite absence authorizes creating the tag.
            case "$tag_error" in
              *"(HTTP 404)"*) ;;
              *) echo "::error::could not check $TAG: $tag_error"; exit 1 ;;
            esac
            target=(--target "$SHA")
          fi
          if gh release view "$TAG" "${repo[@]}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" "${repo[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" "${repo[@]}" "${target[@]}" \
              --title "fragment $TAG" --generate-notes
          fi
          # published, and the latest: the install command fetches from releases/latest
          gh release edit "$TAG" "${repo[@]}" "${target[@]}" --draft=false --latest
      # The marker is written only after all four builds and the publish
      # succeed; read it back with the assets before allowing a header.
      - id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask cli-release record "$TAG" >> "$GITHUB_OUTPUT"
