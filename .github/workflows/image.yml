# Manual image preparation and production promotion. Preview normally
# follows master through ci.yml's preview-image job: this workflow resolves
# and prepares that same input-keyed image.
# Production remains manual: copy the exact preview digest a full round
# proved (from), or explicitly build a new image not proved by that round.
#
# Each environment uses its own token and account ID; a production copy
# also needs PREVIEW_REGISTRY_TOKEN and PREVIEW_ACCOUNT_ID. Only master may
# use preview and only production may use production (ref checks this
# before reaching an environment). A pin is always a manifest digest.
#
# Production's manual build keeps no layer cache (images.yml records the
# old measurements and cache budget); a copy uses skopeo with
# --preserve-digests and checks the result. Preview's persistent BuildKit
# cache lives in ci.yml, a single master-only scope. Even if evicted, an
# existing input tag preserves identity. This manual path can cold-build a
# missing input tag; the normal automatic path warms BuildKit first.
# Preparation finishes before any summary names a ready image, so a later
# deployment cannot half-deploy while Cloudflare prepares it (prepare.rs).
name: image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Whose registry: preview (run from master) or production (run from production)"
        type: choice
        options: [preview, production]
        default: preview
      image:
        description: "The image"
        type: choice
        options: [hermes]
        default: hermes
      from:
        description: "Production only: copy this proven preview image rather than build one (registry.cloudflare.com/<account>/fragment-preview-computer-hermes-canary@sha256:<64 hex>, <account> standing for the preview's)"
        type: string
        required: false
        default: ""
      tag:
        description: "Production tag (preview uses its input key; empty: build commit or copied digest first 12 hex digits)"
        type: string
        required: false
        default: ""

permissions: {}

# one push to each registry at a time, never cancelled mid-way
concurrency:
  group: image-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # the branch each environment's image comes from, and a copy production's
  # alone, checked with no secret
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: the branch for ${{ inputs.environment }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          FROM: ${{ inputs.from }}
        run: |
          case "$ENVIRONMENT $GITHUB_REF" in
            "preview refs/heads/master" | "production refs/heads/production") echo "$ENVIRONMENT's image from $GITHUB_REF at $GITHUB_SHA" ;;
            *) echo "::error::the preview's image is pushed from master, production's from production: this run is $ENVIRONMENT's, from $GITHUB_REF"; exit 1 ;;
          esac
          if [ "$ENVIRONMENT" = preview ] && [ -n "$FROM" ]; then
            echo "::error::from is production's (a copy of a preview image into production's registry): the preview's image is built"
            exit 1
          fi

  push:
    name: ${{ inputs.from != '' && 'copy' || 'push' }} ${{ inputs.image }} to ${{ inputs.environment }}
    needs: ref
    runs-on: ubuntu-latest
    # xtask's build (cold, minutes), the image's (about 7 minutes), and
    # up to four pushes of it; or up to four copies
    timeout-minutes: 60
    permissions:
      contents: read
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # the pinned Node xtask runs wrangler on, unpacked: ci.yml's key, read
      # only (on a miss xtask fetches it, checked by its SHA-256). No Rust
      # cache: xtask alone builds in minutes, and the e2e's cache, which
      # holds it, is gigabytes to restore.
      - uses: actions/cache/restore@v4
        with:
          path: target/tools
          key: node-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs') }}
      - name: build and push
        if: inputs.from == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!v}" || { echo "::error::the environment $ENVIRONMENT has no $v"; exit 1; }
          done
          case "$ENVIRONMENT" in
            preview)
              command -v skopeo > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
              cargo xtask image preview --build --output "$RUNNER_TEMP/preview-image.json" --summary "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            production)
              repository="fragment-computer-$IMAGE"
              echo "::warning::a production build is a new image, not the one a round proved: with no layer cache, its digest is not the one preview ran. A promotion copies the proven digest (from)."
              ;;
          esac
          cargo xtask image push "$IMAGE" --repository "$repository" --tag "${TAG:-${GITHUB_SHA::12}}" --summary "$GITHUB_STEP_SUMMARY"
      - name: copy
        if: inputs.from != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FROM_CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_REGISTRY_TOKEN }}
          FROM_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PREVIEW_ACCOUNT_ID }}
          ENVIRONMENT: ${{ inputs.environment }}
          FROM: ${{ inputs.from }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FROM_CLOUDFLARE_API_TOKEN FROM_CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!v}" || { echo "::error::the environment $ENVIRONMENT has no $v (FROM_CLOUDFLARE_API_TOKEN is its PREVIEW_REGISTRY_TOKEN, FROM_CLOUDFLARE_ACCOUNT_ID its PREVIEW_ACCOUNT_ID)"; exit 1; }
          done
          command -v skopeo > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          digest=${FROM##*@sha256:}
          cargo xtask image copy "$IMAGE" --from "$FROM" --repository "fragment-computer-$IMAGE" --tag "${TAG:-${digest:0:12}}" --summary "$GITHUB_STEP_SUMMARY"
