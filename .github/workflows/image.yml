# A computer image, built from a commit and pushed to an environment's
# Cloudflare registry, by hand (Actions, image, Run workflow): its digest
# is then named in the run's summary as the line a deploy config pins it
# at (`cargo xtask image push`, xtask/src/image.rs; docs/computers.md,
# "One round"). CI's deploys build no image (ci.yml's `deploy`,
# `--pinned-only`), so a canary is built here, and a round waits on no
# one's machine.
#
# Its job runs in the environment the image is for, `preview` or
# `production`, for two of its secrets: CLOUDFLARE_API_TOKEN, which
# wrangler pushes with, and CLOUDFLARE_ACCOUNT_ID, the account whose
# registry it goes to (the deployment's own: a deploy refuses another
# account's image), required here, and masked wherever it appears, the
# summary too. Each is pushed from the branch that deploys it, as the
# environments' own rules also hold: the preview's from master,
# production's from `production` (`ref`, below, refuses any other pairing
# before an environment is reached).
#
# The repositories are the ones the deploys by hand made, which the
# configs pin today (wrangler names a Durable Object container's image
# `<Worker>-<class>-<image>`): the preview's canary, which its stable is
# in too, and production's `hermes`. A tag is a name for people; a config
# pins the digest.
#
# The image builds as a deploy's wrangler builds it (xtask/src/build.rs,
# `image_build`), on the runner's own Docker, with no layer cache:
# images.yml says why. So every run makes a new digest, of a tree whose
# image did not change too: run it for a change to the image
# (docs/computers.md, "What changes a version"), once a round. The disk:
# images.yml's Docker lane builds this image and the stub, and runs them,
# within about 11 GB of the runner's 85 GB free, so none is freed first.
name: image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Whose registry: preview (run from master) or production (run from production)"
        type: choice
        options: [preview, production]
        default: preview
      image:
        description: "The image to build"
        type: choice
        options: [hermes]
        default: hermes
      tag:
        description: "Its tag (empty: the commit's first 12 hex digits, as its deploy's id)"
        type: string
        required: false
        default: ""

permissions: {}

# one push to each registry at a time, never cancelled mid-way
concurrency:
  group: image-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # the branch each environment's image comes from, checked with no secret
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: the branch for ${{ inputs.environment }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$ENVIRONMENT $GITHUB_REF" in
            "preview refs/heads/master" | "production refs/heads/production") echo "$ENVIRONMENT's image from $GITHUB_REF at $GITHUB_SHA" ;;
            *) echo "::error::the preview's image is pushed from master, production's from production: this run is $ENVIRONMENT's, from $GITHUB_REF"; exit 1 ;;
          esac

  push:
    name: push ${{ inputs.image }} to ${{ inputs.environment }}
    needs: ref
    runs-on: ubuntu-latest
    # xtask's build (cold, minutes), the image's (about 7 minutes), and
    # up to four pushes of it
    timeout-minutes: 60
    permissions:
      contents: read
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # the pinned Node xtask runs wrangler on, unpacked: ci.yml's key, read
      # only (on a miss xtask fetches it, checked by its SHA-256). No Rust
      # cache: xtask alone builds in minutes, and the e2e's cache, which
      # holds it, is gigabytes to restore.
      - uses: actions/cache/restore@v4
        with:
          path: target/tools
          key: node-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs') }}
      - name: build and push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!v}" || { echo "::error::the environment $ENVIRONMENT has no $v"; exit 1; }
          done
          case "$ENVIRONMENT" in
            preview) repository="fragment-preview-computer-$IMAGE-canary" ;;
            production) repository="fragment-computer-$IMAGE" ;;
          esac
          cargo xtask image push "$IMAGE" --repository "$repository" --tag "${TAG:-${GITHUB_SHA::12}}" --summary "$GITHUB_STEP_SUMMARY"
