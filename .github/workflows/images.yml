# The computer images' Rust (images/: the bridge and hermes-boot,
# docs/bridge.md): its own workspace, so its own jobs.
#
# - `check`: host tests and clippy, warnings denied, on every change to
#   images/, what it compiles in from outside it, or this workflow
#   (`changes`, below).
# - `docker`: the Docker lane (images/bridge/tests/docker.rs): both images
#   built for linux/amd64 and run in Docker against the fake API and a
#   scripted model, real Hermes included (`cargo test -p fragment-bridge
#   --test docker -- --ignored`). It runs only when a change touches what it
#   builds or runs (`changes` below: images/hermes, images/bridge,
#   images/stub, the images' manifest and lock, the Hermes image's CLI
#   stage's inputs, or this workflow), on pull requests, merge groups and
#   master's pushes, on every run by hand, and whenever `changes` itself
#   did not succeed.
#
# The workflow runs on every pull request, merge group and master push,
# with no path filter of its own: master's ruleset requires `images check`
# and `docker (real Hermes)`, and a check a workflow-level `paths` filter
# keeps from starting never reports, which blocks a pull request that
# touches none of them for good. Each job decides instead (`changes`): one
# its inputs did not change skips, which a required check counts as a
# pass, and one `changes` could not decide for runs.
#
# Their Rust cache (the registry and images/target's dependencies) is
# Swatinem/rust-cache's, one key for both jobs, saved only from master's
# pushes by `check` (a PR reads master's), as ci.yml's.
name: images

on:
  push:
    branches: [master]
  pull_request:
  # `changes` compares a merge group's exact base and head, as it does a
  # pull request's files and a push's since its `before`.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # ci.yml also has `check`; required checks need unambiguous names.
    name: images check
    needs: changes
    # as the Docker lane's: skips when images/ and this workflow did not
    # change, and runs whenever `changes` did not succeed
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.check == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: images
          workspaces: images -> target
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Whether `check` and the Docker lane run: a change to what each checks,
  # builds or runs. Its own job, since a job's `if` reads only another
  # job's outputs. The changed
  # files are the pull request's (from the API, every page), or the push's
  # since its `before`, or the merge group's since its exact base (by git,
  # hence the checkout); a run by hand runs the lane whatever it says.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check: ${{ steps.paths.outputs.check }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.merge_group.base_sha || github.ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          filters: |
            check:
              - images/**
              - .github/workflows/images.yml
              # what images/ compiles in from outside it, which a host test
              # (xtask/src/image/preview.rs) holds this list to
              - cli/SKILL.md
              - templates/skills/**
              - crates/e2e/fixtures/chat-preview.pdf
            docker:
              - images/hermes/**
              - images/bridge/**
              - images/stub/**
              - images/Cargo.toml
              - images/Cargo.lock
              - .github/workflows/images.yml
              # the Hermes image's other inputs, its CLI stage's (#715):
              # xtask/src/image/preview.rs `INPUTS`, which a host test
              # holds this list and the paths above to
              - .dockerignore
              - Cargo.toml
              - Cargo.lock
              - cli/**
              - crates/core/**
              - crates/nip98/**
              - crates/proto/**
              - crates/templates/**
              - templates/blank/**
              - templates/calories/**
              - templates/doc/**
              - templates/inbox/**
              - templates/notes/**
              - templates/todo/**
              - crates/devstack/Cargo.toml
              - crates/e2e/Cargo.toml
              - crates/fakes/Cargo.toml
              - xtask/Cargo.toml

  # The Docker lane. The images are built first by the runner's own Docker
  # (its BuildKit, straight into its image store, under the tags the tests
  # run), then the tests run on them with FRAGMENT_DOCKER_SKIP_BUILD, in
  # parallel (one per CPU). Measured on ubuntu-latest (4 CPUs, 16 GB, a
  # 145 GB disk with about 85 GB free): the Hermes image builds in about
  # 7 minutes (its two Rust stages, the CLI's and the bridge's, about
  # 5.5 of them), the tests take about 3, and the job uses at most about
  # 11 GB of the disk (71 GB used of 145 at its peak, 75 GB free).
  #
  # No layer cache, by measurement (PR #252): with BuildKit's layers in the
  # Actions cache (mode=max), an image whose every input was unchanged built
  # in 2 minutes, but that is a re-run's case. The CLI's stage, the build's
  # longest, reads the root workspace, which 108 of master's 147 commits
  # from 2026-10-01 to 10-08 changed: of the 33 pairs of master's
  # image-touching commits in that time, the CLI's stage was unchanged
  # across 6. What the cache would still hit (the Hermes base, its own
  # layer since 2026-10-09) is off the build's critical path, which is the
  # Rust. It cost 3.3 GB of the repository's
  # 10 GB of caches, and about 1.5 GB more at each write, against the
  # caches ci.yml reads on every run.
  #
  # The tests' container logs are kept on failure.
  docker:
    name: docker (real Hermes)
    needs: changes
    # fails closed: a `changes` that did not succeed (it failed, or ran out
    # its time, as in run 41100441445) runs the lane rather than skip it,
    # which a required check would count as a pass
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    # ubuntu-24.04 (Docker 28), not ubuntu-latest: since 2026-10-25,
    # ubuntu-latest is 26.04 with Docker 29, whose containerd image store
    # names `containerd` in every container's root mount, so Hermes takes
    # even the Containers-shaped run (no /.dockerenv) for a container, and
    # `an_agents_home_is_the_same_on_either_runtime` proves nothing (it says
    # so). Containers on Cloudflare show no such mount.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: images
    steps:
      - uses: actions/checkout@v4
      # ubuntu-24.04's image from 20261018 is a 72 GB root with 12 GB free
      # once the lane's test binary is built, which its two images (6.4 GB)
      # and their build cache (2.7 GB) all but fill: run 41249649091's tests
      # ran out of disk. The lane uses none of the image's Android, .NET,
      # Haskell, Swift or CodeQL, nor its cached Docker images: they go first.
      - name: free the disk
        working-directory: .
        run: |
          df -h /
          lsblk -o NAME,SIZE,TYPE,MOUNTPOINT
          sudo dmsetup status 2>/dev/null || true
          sudo du -sh /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          docker system df
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune -af > /dev/null
          df -h /
          # the root's use every 5 seconds, whose peak `disk, after` says
          nohup sh -c 'while :; do df -B1M --output=used / | tail -1; sleep 5; done' > "$RUNNER_TEMP/disk-used" 2>&1 &
      - uses: dtolnay/rust-toolchain@stable
      # the check job's cache, read only
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: images
          workspaces: images -> target
          cache-bin: false
          save-if: false
      - run: cargo test -p fragment-bridge --test docker --locked --no-run
      - name: the runner
        run: nproc; free -g; df -h /; docker version --format '{{.Server.Version}}'
      # as the tests' own `build` does (docker.rs), both from the repo's root
      # (each carries the fragment CLI, of the root workspace)
      - name: build the stub image
        working-directory: .
        run: docker build --platform linux/amd64 -f images/stub/Dockerfile -t fragment-stub:test .
      - name: build the Hermes image
        working-directory: .
        run: docker build --platform linux/amd64 -f images/hermes/Dockerfile -t fragment-hermes:test .
      # the tests build only the lab image, from the Hermes image: the
      # builds' cache goes before them
      - name: disk, built
        run: docker system df; docker builder prune -af > /dev/null; df -h /
      - name: the Docker lane
        run: cargo test -p fragment-bridge --test docker --locked -- --ignored --show-output
        env:
          FRAGMENT_DOCKER_SKIP_BUILD: "1"
          RUST_BACKTRACE: "1"
      - if: always()
        name: disk, after
        run: |
          docker system df; df -h /
          echo "peak: $(sort -n "$RUNNER_TEMP/disk-used" | tail -1) MiB used"
      # each container's log (Container's drop) and the tests' own
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-lane-logs
          path: images/target/tmp/**/*.log
          retention-days: 7
