# The search service's Rust (search/, search/README.md): its own workspace,
# so its own job: host tests and clippy, warnings denied, on every change
# here. Its object-store test (`on_an_object_store`) needs a store, and
# runs by hand. Its Rust cache is Swatinem/rust-cache's, saved only from
# master's pushes, as images.yml's.
name: search

on:
  push:
    branches: [master]
    paths: ["search/**", ".github/workflows/search.yml"]
  pull_request:
    paths: ["search/**", ".github/workflows/search.yml"]
  workflow_dispatch:

concurrency:
  group: search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: search check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: search
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: search
          workspaces: search -> target
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
