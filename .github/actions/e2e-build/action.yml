# The e2e's build on a runner (ci.yml): its caches restored, BuildKit's
# builder set up, and `cargo xtask e2e --build-only` (the
# cell, the CLI and the suite, and the computer images the node's boot
# builds), with this commit's builds saved for the runs after it when
# `save` says so.
# ci.yml's shards run it before their sections, and on a master push whose
# shards skip (`proven`), `e2e-build` runs it alone, so every pull request
# and merge group still starts from master's newest build and layers.
name: e2e build
description: the e2e's caches, its stub image and its build, saved when asked
inputs:
  save:
    description: "'true' to save this commit's builds, the tools and the stub's layers (master's pushes only: a branch's caches are its own)"
    required: true
  worker-build-version:
    description: worker-build's version (xtask/src/build.rs, WORKER_BUILD_VERSION)
    required: true
outputs:
  builder:
    description: the BuildKit builder the computer images were built in, for BUILDX_BUILDER
    value: ${{ steps.buildx.outputs.name }}
  js-cache-hit:
    description: whether the JavaScript caches' key was restored whole
    value: ${{ steps.js.outputs.cache-hit }}
  js-cache-key:
    description: the JavaScript caches' key, to save it under after a run
    value: ${{ steps.js.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - id: rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    # the e2e build's tools: cargo's home (the registry, and worker-build
    # in ~/.cargo/bin; its version is in the key) and what worker-build
    # fetches (wasm-bindgen at the lockfile's version, wasm-opt, esbuild).
    # Saved when asked, even from a red run; `deploy` restores it (its key
    # shared, not the job's: the same inputs there). Its builds are the
    # next step's.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: e2e-tools-worker-build-${{ inputs.worker-build-version }}
        workspaces: |
          . -> target
          cell -> target
        cache-targets: false
        cache-directories: ~/.cache/worker-build
        cache-on-failure: true
        save-if: ${{ inputs.save == 'true' }}
    # The e2e's builds, our own crates' with them: xtask (target/debug),
    # the CLI and the suite (target/release), and the cell's wasm32 builds
    # (cell/target), as the newest master commit that saved them left
    # them (below), with the record of the tree they were built from
    # (target/built-tree). After this rust-cache's, which may clean the
    # target directories as it restores.
    - id: builds
      uses: actions/cache/restore@v4
      with:
        path: |
          target/built-tree
          target/debug
          target/release
          cell/target
        key: e2e-builds-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ github.sha }}
        restore-keys: e2e-builds-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-
    # The checkout's mtimes, before any cargo build (xtask/src/stamp.rs,
    # which says how, compiled alone for it): every file and directory
    # now, newer than any build restored, then each the record holds as
    # the checkout does at the time since which it has, so cargo takes as
    # built what was built from this very content, and nothing else
    # (another feature set's build, kept from an older tree). The record
    # goes into the state directory with this build's start, for the
    # record saved below: only a build that succeeded saves one.
    - shell: bash
      run: |
        rustc --edition 2021 -O -o "$RUNNER_TEMP/stamp" xtask/src/stamp.rs
        "$RUNNER_TEMP/stamp" restore target/built-tree "$RUNNER_TEMP/stamp-state"
    # no setup-node: xtask fetches the pinned Node into target/tools
    # (crates/devstack/src/node_release.rs, checked by its SHA-256) and
    # runs its own npm ci; the runner's node is never used. A new pin is
    # a new key.
    - id: node
      uses: actions/cache/restore@v4
      with:
        path: target/tools
        key: node-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs') }}
    # what the JavaScript caches (target/cache): npm's tarballs, wrangler's
    # own, and the Chrome for Testing Browser Rendering downloads, which
    # the lockfile's miniflare names
    - id: js
      uses: actions/cache/restore@v4
      with:
        path: target/cache
        key: js-cache-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs', 'package-lock.json') }}
    - shell: bash
      env:
        WORKER_BUILD_VERSION: ${{ inputs.worker-build-version }}
      run: worker-build --version | grep -qF "$WORKER_BUILD_VERSION" || cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked
    # The builder the computer images build in, BuildKit's own (setup-buildx's):
    # xtask's builds ahead of the node and the node's boot (wrangler's) go
    # to it by BUILDX_BUILDER (below), as they would otherwise to the Docker
    # engine's builder, which can read no Actions cache (`buildx use` does
    # not move `docker build`).
    - id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    # The Actions runtime BuildKit's `type=gha` cache needs, handed to the
    # build step below alone (its env), never to the job: a shell step is
    # given none of it, and only a JavaScript action's process holds it.
    # The token reaches xtask's image builds, whose stub's layers it reads
    # (and on master's pushes writes); the tests run in later steps without
    # it. The e2e runs only on trees a review let through (merge groups and
    # master's pushes, or a pull request its label opts in), with locked
    # dependencies. It replaces a build of the stub here that read the
    # cache for itself and warmed nothing: BuildKit takes a remote cache's
    # hits without fetching them, and that build exported nothing, so
    # xtask's build after it compiled the bridge on every shard (195 s of
    # a 196 s `--build-only` on a cached commit, run 41548180413).
    - id: runtime
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          if (process.env.ACTIONS_RUNTIME_TOKEN) core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
          for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
            core.setOutput(name, process.env[name] ?? '');
          }
    # the cell, the CLI and the suite, and the computer images the node's
    # boot builds (xtask/src/build.rs `images`), all at once. The stub's
    # layers come from the Actions cache (scope e2e-stub): an unchanged
    # bridge (images/bridge, images/hermes/boot, the images' manifest and
    # lock: about one master commit in eight changes one) is its layers
    # fetched in seconds, not compiled (about 100 s alone, 250 beside the
    # Rust); its CLI stage likewise until the CLI or a crate it builds from
    # changes. Saved when asked, every stage's layers (mode=max).
    - shell: bash
      env:
        BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        FRAGMENT_IMAGE_CACHE: type=gha,scope=e2e-stub
        FRAGMENT_IMAGE_CACHE_SAVE: ${{ inputs.save }}
        ACTIONS_RUNTIME_TOKEN: ${{ steps.runtime.outputs.ACTIONS_RUNTIME_TOKEN }}
        ACTIONS_RESULTS_URL: ${{ steps.runtime.outputs.ACTIONS_RESULTS_URL }}
        ACTIONS_CACHE_URL: ${{ steps.runtime.outputs.ACTIONS_CACHE_URL }}
        ACTIONS_CACHE_SERVICE_V2: ${{ steps.runtime.outputs.ACTIONS_CACHE_SERVICE_V2 }}
      run: cargo xtask e2e --build-only
    # this commit's builds, with the tree they were built from, for the
    # runs after it, when asked (a red e2e's too: its build was green),
    # unless this commit's are kept already (a re-run)
    - if: inputs.save == 'true' && steps.builds.outputs.cache-hit != 'true'
      shell: bash
      run: '"$RUNNER_TEMP/stamp" record target/built-tree "$RUNNER_TEMP/stamp-state"'
    - if: inputs.save == 'true' && steps.builds.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          target/built-tree
          target/debug
          target/release
          cell/target
        key: ${{ steps.builds.outputs.cache-primary-key }}
    - if: inputs.save == 'true' && steps.node.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: target/tools
        key: ${{ steps.node.outputs.cache-primary-key }}
