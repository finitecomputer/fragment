# Spike only: the phone variant for the Mac's install helper, which builds
# ios/Fragment.xcodeproj scheme Fragment and installs Fragment.app. The bundle
# id differs from the real app's (build.finite.fragment), so it installs
# beside it and never over it. SpikeDefaults.json is its config.
name: Fragment
options:
  bundleIdPrefix: build.finite
  deploymentTarget:
    iOS: "18.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  Fragment:
    type: application
    platform: iOS
    sources: [Sources, {path: SpikeDefaults.json, buildPhase: resources}]
    settings:
      base:
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        PRODUCT_BUNDLE_IDENTIFIER: build.finite.tsspike
        PRODUCT_NAME: Fragment
    info:
      path: Generated/Info-phone.plist
      properties:
        CFBundleDisplayName: TS Spike
        UILaunchScreen: {}
        UIApplicationSceneManifest: {UIApplicationSupportsMultipleScenes: false}
        CFBundleURLTypes: [{CFBundleURLSchemes: [tsspike]}]
        NSLocalNetworkUsageDescription: The spike reaches tailnet peers on your network directly.
        NSAppTransportSecurity: {NSExceptionDomains: {ts.net: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true}, sslip.io: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true}}}
    dependencies:
      - framework: ../Frameworks/TailscaleKit.xcframework
        embed: true
