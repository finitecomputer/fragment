[package]
name = "fragment-search"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Fragment's search service: a fragment's sections in LanceDB, on object storage or a disk."

# Its own workspace and lock, as images/ and bench/ are: LanceDB's tree
# (Arrow, DataFusion, Lance, object_store) stays out of the root build.
[workspace]

[dependencies]
# 0.40.0 (0.41.0 is younger than the two-week dependency cooldown); its
# job.rs names an error variant only `remote` defines, so it builds only
# with it. `aws` is S3's and R2's object store.
lancedb = { version = "=0.40.0", features = ["remote", "aws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Lance names a prune's cutoff in chrono's time (`store::prune`)
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "server", "http1"] }

[profile.release]
strip = true
# Assertions stay on in release (the engineering style).
debug-assertions = false
overflow-checks = true
