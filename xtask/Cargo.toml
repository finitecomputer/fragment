[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `sqlite`: the schema lock, rendered from a real SQLite (schema_lock.rs)
fragment-core = { path = "../crates/core", features = ["sqlite"] }
# `schema`: the wire's schema and lock, from its routes and types (wire/)
fragment-proto = { path = "../crates/proto", features = ["schema"] }
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
# the wire's types' serde attributes, read from crates/proto's source (wire/source.rs)
syn = { version = "2.0.119", features = ["full", "visit"] }
fragment-devstack = { path = "../crates/devstack" }
# dev's operator key (main.rs `dev`), which `fragment operator wipe` signs with
fragment-nip98 = { path = "../crates/nip98" }
# the release's files, written into the cell's Static Assets at each build (build.rs)
fragment-templates = { path = "../crates/templates", features = ["embed"] }
fragment-fakes = { path = "../crates/fakes" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
