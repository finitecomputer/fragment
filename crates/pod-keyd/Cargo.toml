[package]
name = "fragment-pod-keyd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "pod-keyd, in a TD of its own: holds owners' pod disk keys in memory and releases one to a boot of that pod whose quote passes the owner's checks against releases the owner approved (docs/pod.md, \"A key service\")."

# The binary is src/bin/pod-keyd.rs, found by its path, so a workspace
# that stubs this crate with an empty src/lib.rs (the images' CLI stages)
# names no missing file.
#
# fragment-pod with `verify`: the same checks the owner's CLI runs, and
# through them dcap-qvl and the blocking rustls client that fetches
# Intel's collateral and Google's registry. So unlike pod-init this does
# not build static for musl without a C toolchain (ring). pod-init's
# library for what a service in a TD needs to attest itself and answer:
# its quoter (configfs-tsm), its small HTTP server and the event log.
[dependencies]
fragment-pod = { path = "../pod", features = ["verify"] }
fragment-pod-init = { path = "../pod-init" }
hex = "0.4"
serde_json = "1"
# A release nonce is a MAC over the time it was made, so issuing one
# keeps nothing (src/nonces.rs). HMAC-SHA256 from RustCrypto, the
# generation fragment-pod's hpke already brings (through hkdf).
hmac = "0.12"
sha2 = "0.10"
# The nonce key zeroizes when the process ends, as fragment-pod's keys do.
zeroize = "1"
