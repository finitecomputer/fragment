[package]
name = "fragment-fakes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local stand-ins for the services the platform calls: code.storage, Workers AI, WorkOS, an OpenID Connect provider, a web push service, and a computer swap's provider APIs."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# The fakes' own half of the platform's crypto: the push service decrypts
# as a browser (HKDF, AES-GCM).
hkdf = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8"] }
# The OpenID Connect fake: it signs id_tokens RS256 and ES256 with keys it
# makes, and HS256 with the client secret when a test spoils one.
rsa = { version = "=0.9.10", features = ["sha2"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
hmac = "0.12"
fragment-core = { path = "../core" }
fragment-proto = { path = "../proto" }
url = "2.5"
# the client half of src/http.rs (`post`): plain HTTP, no TLS
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
fragment-nip98 = { path = "../nip98", features = ["sign"] }
