[package]
name = "fragment-devstack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Starts and stops the local fragment stack (`wrangler dev` for cell/ and agent/) for xtask and the e2e, on a pinned Node it fetches."

[dependencies]
anyhow = "1"
fragment-core = { path = "../core" }
fragment-proto = { path = "../proto" }
serde_json = "1"
# the pinned Node (src/node.rs): fetched over HTTPS, checked by its
# SHA-256, unpacked from its .tar.gz
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
# termination signals (src/signals.rs): signal-hook's handler and the
# thread that hears it; libc for what it has no say in (a disposition read,
# Ctrl-C ignored for the processes started), already in the lock beneath reqwest
signal-hook = "0.4"
libc = "0.2"
