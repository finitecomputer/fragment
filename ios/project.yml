name: Fragment
options:
  # XcodeGen 2.42 needs the Icon Composer package kept as one resource.
  fileTypes:
    icon:
      file: true
  bundleIdPrefix: build.finite
  deploymentTarget:
    iOS: "26.0"
packages:
  secp256k1:
    url: https://github.com/21-DOT-DEV/swift-secp256k1.git
    exactVersion: 0.21.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: "$(TARGET_NAME)"
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    ONLY_ACTIVE_ARCH: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_TESTABILITY: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  Fragment:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: secp256k1
        product: P256K
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: build.finite.fragment
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Finite
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Debug:
          INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to your local Finite development server."
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "Connect to your local Finite development server."
        NSMicrophoneUsageDescription: "Record voice memos to send to your agents."
        CFBundleDisplayName: Finite
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  FragmentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Fragment
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Fragment.app/Fragment"
  FragmentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Fragment
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Fragment
schemes:
  Fragment:
    build:
      targets:
        Fragment: all
    run:
      config: Debug
    test:
      targets: [FragmentTests, FragmentUITests]
