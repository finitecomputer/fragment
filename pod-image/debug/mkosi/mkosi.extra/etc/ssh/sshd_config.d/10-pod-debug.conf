# The root is read-only: the host key is this boot's (/run), the one
# authorized key is the image's. Only the stack's user, by key.
HostKey /run/pod-ssh/ssh_host_ed25519_key
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
AllowUsers alex
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
