# The debug sibling only: the locked image plus SSH for the stack's user
# (one key, the config's build.debug_key, which the build puts in as
# /etc/ssh/authorized_keys/alex) and sudo without a password. For
# development and rescue. Its registers differ from the locked image's by
# construction (other packages, other files, so another root hash).
[Content]
Packages=
        openssh-server
        sudo
# Ubuntu's package makes host keys at install; a measured image is public,
# so they go, and each boot makes one in memory (pod-ssh-hostkey)
RemoveFiles=
        /etc/ssh/ssh_host_*
