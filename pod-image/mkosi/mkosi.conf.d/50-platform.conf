# The platform the image carries, read-only, from /usr/lib/pod: the
# pinned platform (../../pinned-platform, built and staged by
# `cargo xtask pod image platform`), put in by the 40-platform-paths.conf
# the build writes (ExtraTrees= the stage, PackageDirectories= the pinned
# Docker and Tailscale packages), and pod-init on port 7000.

[Content]
Packages=
        # the data disk: LUKS2, ext4, and its udev name (NVMe vendor data)
        cryptsetup
        e2fsprogs
        nvme-cli
        # the open hook and the address it picks
        iproute2
        curl
        ca-certificates
        nftables
        iptables
        tmux
        # Docker's default seccomp and AppArmor profiles need apparmor_parser
        apparmor
        # DNS for the host (Docker hands containers its upstream) and the clock
        systemd-resolved
        systemd-timesyncd
        # the agents' computers: Docker CE and containerd.io, what the demo runs
        docker-ce
        docker-ce-cli
        containerd.io
        tailscale
        # chrome-headless-shell (the card renderer) and NSS's certutil
        libnss3
        libnspr4
        libatk1.0-0t64
        libatk-bridge2.0-0t64
        libcups2t64
        libdrm2
        libxkbcommon0
        libxcomposite1
        libxdamage1
        libxfixes3
        libxrandr2
        libgbm1
        libasound2t64
        libpango-1.0-0
        libcairo2
        fonts-liberation
        libnss3-tools
# mkosi's own SSH (a vsock socket) never; P-debug installs Ubuntu's sshd
Ssh=never
