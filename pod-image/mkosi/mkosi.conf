# The pod's measured image: one unified kernel image (kernel, initrd and
# command line in one PE file) at \EFI\BOOT\BOOTX64.EFI, booted by the
# firmware directly (no shim, no GRUB), and a read-only erofs root under
# dm-verity whose root hash mkosi puts on that file's command line.
# This is the locked image; ../debug/mkosi adds SSH for its debug sibling.
# Built by `cargo xtask pod image build` with mkosi at the commit
# ../pins.jsonc names (docs/pod.md, "The image").

[Distribution]
Distribution=ubuntu
Release=noble
# universe: systemd-boot-efi (the stub)
Repositories=universe
# Ubuntu's snapshot service: the same package set on every build, so a
# rebuild changes only what we change.
Snapshot=20261110T205547Z

[Output]
Format=disk
Output=pod
CompressOutput=no
# 512-byte sectors for the GPT and the ESP's FAT. Left to itself repart
# formats the FAT with 4096-byte sectors, and Google's firmware then finds
# no \EFI\BOOT\BOOTX64.EFI on the disk ("Not Found").
SectorSize=512
SplitArtifacts=uki,roothash
# systemd-repart derives partition and disk UUIDs from this seed (and the
# verity partitions' UUIDs from the root hash), so they do not vary.
Seed=6f0d2b7e-4c1a-4f55-9d2e-3b8a1c9e7f42

[Content]
Bootable=yes
Bootloader=uki
SourceDateEpoch=1794268800
Packages=
        systemd
        systemd-sysv
        udev
        kmod
        # Ubuntu's Google Cloud kernel: TDX guest, configfs-tsm, gVNIC, NVMe
        linux-image-gcp
        # the systemd-stub ukify wraps the kernel in
        systemd-boot-efi
# The initrd needs only what mounts the root: mkosi-initrd's default
# module list (NVMe, dm-verity, erofs among them), not every module.
KernelInitrdModules=default
WithDocs=no
# Package installation leaves two files that differ on every build (the
# ldconfig cache's inode numbers and timestamps, and a log): without them a
# rebuild is byte for byte the same. /var is a tmpfs when the image runs,
# so nothing under it in the image is ever seen.
RemoveFiles=
        /var/log/*
        /var/cache/*
Locale=C.UTF-8
Hostname=pod
# /var is a tmpfs (the root is read-only). Getty, rescue, emergency and the
# debug shell are masked here and in the image, so there is no shell to
# reach from the serial console. roothash= is added by mkosi.
KernelCommandLine=
        console=ttyS0,115200
        systemd.volatile=state
        systemd.mask=emergency.service
        systemd.mask=rescue.service
        systemd.mask=debug-shell.service
        rd.systemd.mask=emergency.service
        rd.systemd.mask=rescue.service
        rd.systemd.mask=debug-shell.service

[Build]
# Tools (systemd-repart, ukify, mkfs.erofs) come from a Debian trixie tree
# mkosi builds once and keeps, not from the build box.
ToolsTree=yes
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
