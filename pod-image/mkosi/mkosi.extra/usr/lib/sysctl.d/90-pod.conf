# Docker forwards its containers' traffic. Set here and not left to dockerd:
# on Google's stock image a later sysctl reload reset it to 0 and silently
# cut every container off.
net.ipv4.ip_forward = 1
# The front door (443), the root's page (80) and the zone's DNS (53) bind
# as the stack's user, with no capability on any binary.
net.ipv4.ip_unprivileged_port_start = 53
# Chrome's own sandbox (the card renderer) needs unprivileged user
# namespaces, which Ubuntu's AppArmor package restricts (10-apparmor.conf).
kernel.apparmor_restrict_unprivileged_userns = 0
