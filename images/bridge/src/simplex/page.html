<!doctype html>
<!-- An agent's SimpleX link (images/bridge/src/simplex/http.rs), on its
     computer's screen port, framed by the platform's page for its owner
     (Settings' connector dialog, cell/shell/connector-setup.js). It reads
     and moves the link through `state`, `link` and `unlink` beside it, and
     shows the one-time invitation as a QR code the bridge draws
     (`qr.svg`). A link or an unlink takes a ticket, which it asks the
     platform's page framing it for (which asks the platform, for the
     agent's owner alone); the invitation is shown to the page whose link
     ticket made it (its nonce, `s`). Each step is one line and its
     controls, as Telegram's setup is (templates/telegram/site/setup.js). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleX</title>
<style>
  /* The shell's look, as the platform's stylesheet draws it
     (cell/fragment.css, the theme's variables and its pill buttons): this
     page is its computer's, of another origin, and comes with its image,
     so it carries its own copy of what it uses. Framed in the dialog it is
     the dialog's content, on its surface (transparent), light or dark as
     the shell says (`theme`), or as the system does until it has. */
  @import url("https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500;600&display=swap");
  :root {
    color-scheme: light dark;
    --fg: light-dark(#171717, #ececec);
    --bg: light-dark(#f7f6f3, #212121);
    --muted: light-dark(#66615b, #a6a19d);
    --line-strong: light-dark(rgba(20, 20, 20, .18), rgba(255, 255, 255, .16));
    --soft: light-dark(#f0eee9, #262625);
    --accent: light-dark(#315fbd, #8ab4ff);
    --danger: light-dark(#81112f, #f3b3b3);
    --font: "Funnel Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    accent-color: var(--accent);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; color: var(--fg); font: .875rem/1.45 var(--font); -webkit-font-smoothing: antialiased; }
  /* room for a control's focus ring, inside the frame */
  main { display: flex; flex-direction: column; padding: 3px; }
  p { margin: 0; color: var(--muted); }
  p.now { color: var(--fg); }
  p + p { margin-top: 4px; }
  .error { color: var(--danger); }
  a { color: var(--accent); text-underline-offset: 2px; }
  .tags { display: flex; gap: 6px; margin-bottom: 14px; }
  .tag { padding: 0 6px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 11px; font-weight: 500; line-height: 16px; white-space: nowrap; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0 0; }
  .row + p { margin-top: 8px; }
  button, a.button { display: inline-flex; align-items: center; justify-content: center; min-height: 2.25rem; padding: 0 1rem; border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); font: inherit; font-weight: 500; text-decoration: none; cursor: pointer; }
  /* a quiet action, as the shell's dialogs draw one: its hairline, its surface */
  button.quiet { color: var(--fg); background: var(--soft); box-shadow: inset 0 0 0 1px var(--line-strong); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .choice { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--fg); }
  .choice input { width: 16px; height: 16px; margin: 0; }
  /* on white, as a phone's camera reads it best */
  .qr { display: block; width: 200px; height: 200px; margin: 12px 0 0; padding: 8px; background: #fff; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line-strong); }
</style>
</head>
<body>
<main id="main" aria-live="polite"><p>Loading…</p></main>
<script>
  "use strict";
  const params = new URLSearchParams(location.search);
  const agent = params.get("agent") || "";
  // the agent's name: its fragment's title, as the platform's page tells it
  // (the computer knows only its label); its label until then
  let name = agent.split("--")[0] || "your agent";
  let view = null;
  let busy = false;
  let timer = 0;
  // the platform's page framing this one (its first word's origin), and the
  // nonce of the link ticket this page was handed last: its invitation's
  let parentOrigin = "";
  let session = "";
  const main = document.getElementById("main");
  const q = (path) => `${path}?agent=${encodeURIComponent(agent)}${session ? `&s=${session}` : ""}`;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function button(label, cls, onclick) {
    const b = el("button", cls, label);
    b.type = "button";
    b.disabled = busy;
    b.onclick = onclick;
    return b;
  }
  const row = (...items) => {
    const r = el("div", "row");
    r.append(...items);
    return r;
  };
  // what it is, a word each, as Settings says it (Paul, 2026-10-31)
  function tags() {
    const t = el("div", "tags");
    const secure = el("span", "tag", "Secure");
    secure.title = "Encrypted between your SimpleX app and your computer";
    t.append(el("span", "tag", "Experimental"), secure);
    return t;
  }

  async function ask(method, path, ticket) {
    const sent = ticket ? { body: JSON.stringify(ticket), headers: { "content-type": "application/json" } } : {};
    const r = await fetch(q(path), { method, credentials: "same-origin", ...sent });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.message || `${r.status}`);
    return body;
  }
  // whether the agent is to reach its person on SimpleX (its home), asked
  // once as a link starts, yes by default, and said in the link's ask
  let home = true;
  // why the last ask's choice of where reminders go was not saved, if it was not
  let homeNote = null;
  // a ticket to link or unlink, from the platform's page framing this one
  // (a link's ask says where the agent is to reach its person)
  function ticketFor(want, extra = {}) {
    return new Promise((resolve, reject) => {
      if (!parentOrigin) return reject(new Error("open this from your Settings"));
      const heard = (e) => {
        const m = e.data;
        if (e.source !== window.parent || e.origin !== parentOrigin || !m || m.fragment !== "simplex" || m.agent !== agent || m.for !== want) return;
        removeEventListener("message", heard);
        clearTimeout(late);
        if (m.ticket) resolve(m);
        else reject(new Error(m.error || "no ticket"));
      };
      const late = setTimeout(() => {
        removeEventListener("message", heard);
        reject(new Error("your Settings didn't answer"));
      }, 15000);
      addEventListener("message", heard);
      window.parent.postMessage({ fragment: "simplex", agent, want, ...extra }, parentOrigin);
    });
  }
  // each change of the link moves this on: a poll begun before it is
  // obsolete, success or failure, and changes nothing it shows
  let epoch = 0;
  // an unlink asked to be sure of, in its own step (no browser dialog in a frame)
  let unlinking = false;
  async function act(want, extra) {
    unlinking = false;
    epoch++;
    clearTimeout(timer);
    busy = true;
    render();
    try {
      const answer = await ticketFor(want, extra);
      const ticket = answer.ticket;
      // where reminders go, asked as the link starts: said when it was not saved
      homeNote = answer.homeError ? `Where reminders go wasn't changed (${answer.homeError}): change it in Settings.` : null;
      if (want === "link") session = ticket.nonce;
      view = await ask("POST", want, ticket);
    } catch (e) {
      view = { ...(view || {}), why: `That didn't go through: ${e.message}` };
    }
    busy = false;
    render();
    schedule();
  }
  async function refresh() {
    const at = epoch;
    if (busy) return schedule();
    let got;
    try {
      got = await ask("GET", "state");
    } catch (e) {
      got = { error: e.message };
    }
    if (at !== epoch || busy) return;
    view = got;
    render();
    schedule();
  }
  function schedule() {
    clearTimeout(timer);
    // while a link is being made or shown, its use is seen at once
    const soon = view && (view.phase === "asking" || view.phase === "inviting");
    timer = setTimeout(refresh, soon ? 2000 : 10000);
  }

  // a step: its tags, its line (or what failed), and its controls
  function say(line, ...parts) {
    main.replaceChildren(tags(), line, ...parts);
  }
  function render() {
    if (!view) return say(el("p", null, "Loading…"));
    if (view.error) {
      return say(el("p", "error", view.error.includes("not on this computer") ? "SimpleX isn't on this computer." : `Couldn't reach SimpleX: ${view.error}`));
    }
    // what went wrong, and where reminders go when that wasn't saved
    const why = () => [view.why, homeNote].filter(Boolean).map((t) => el("p", "error", t));
    if (!view.alwaysOn) return say(el("p", null, view.why || "SimpleX works while your computer stays on."));
    switch (view.phase) {
      case "off": {
        // asked once, as the link starts: yes unless unticked
        const choice = el("label", "choice");
        const box = el("input");
        box.type = "checkbox";
        box.checked = home;
        box.disabled = busy;
        box.onchange = () => { home = box.checked; };
        choice.append(box, `Send ${name}'s reminders here`);
        return say(el("p", "now", `Link ${name} to SimpleX Chat on your phone.`), choice, row(button("Link SimpleX", "", () => act("link", { home }))), ...why());
      }
      case "asking": {
        // stuck (SimpleX would not start, or stopped too often): its way on
        const stuck = view.why ? [row(button("Try again", "", () => act("link")), button("Cancel", "quiet", () => act("unlink")))] : [];
        return say(el("p", "now", "Making your link…"), ...stuck, ...why());
      }
      case "inviting": {
        if (view.hidden) {
          // its code is shown only where it was made: made again, here
          return say(el("p", "now", "Your code was made in another window."), row(button("Show it here", "", () => act("link")), button("Cancel", "quiet", () => act("unlink"))), ...why());
        }
        const line = el("p", "now");
        const app = el("a", null, "SimpleX Chat");
        app.href = "https://simplex.chat/";
        app.target = "_blank";
        app.rel = "noopener noreferrer";
        line.append("Scan this in ", app, " on your phone.");
        const open = el("a", "button", "Open in SimpleX");
        open.href = view.link;
        const copy = button("Copy link", "quiet", async () => {
          try {
            await navigator.clipboard.writeText(view.short || view.link);
            copy.textContent = "Copied";
          } catch {
            copy.textContent = "Couldn't copy";
          }
        });
        const img = el("img", "qr");
        img.alt = "A QR code that links your SimpleX app to this agent";
        // the link in its name, so a new invitation is drawn anew
        img.src = `${q("qr.svg")}&v=${encodeURIComponent((view.short || view.link || "").slice(-16))}`;
        return say(line, row(open, copy, button("Cancel", "quiet", () => act("unlink"))), img, ...why());
      }
      case "linked": {
        if (unlinking) {
          return say(
            el("p", "now", `Unlink ${name}? Your SimpleX app will show the chat as deleted.`),
            row(button("Unlink", "", () => act("unlink")), button("Keep it", "quiet", () => { unlinking = false; render(); })),
          );
        }
        const starting = view.running ? [] : [el("p", null, "Starting SimpleX…")];
        return say(el("p", "now", `Linked to ${view.name || "your SimpleX app"}.`), ...starting, row(button("Unlink", "quiet", () => { unlinking = true; render(); })), ...why());
      }
      default:
        return say(el("p", null, "Loading…"));
    }
  }

  // the shell's light or dark (its `theme`, to every frame), from the page
  // framing this one: only how this page looks
  addEventListener("message", (e) => {
    const m = e.data;
    if (e.source === window.parent && m?.fragment === "theme" && (m.mode === "light" || m.mode === "dark")) document.documentElement.dataset.theme = m.mode;
  });
  // the agent's name, from the platform's page framing this one, for its
  // own agent: its first word names the origin tickets are asked of
  addEventListener("message", (e) => {
    const m = e.data;
    if (e.source !== window.parent || !m || m.fragment !== "simplex" || m.agent !== agent || typeof m.name !== "string" || !m.name.trim()) return;
    parentOrigin ||= e.origin;
    name = m.name.trim().slice(0, 80);
    render();
  });
  refresh();
</script>
</body>
</html>
