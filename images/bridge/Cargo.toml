[package]
name = "fragment-bridge"
version = "0.1.0"
description = "The bridge a computer image runs: an agent runtime on one side, the fragment API on the other (docs/computers.md)"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fragment-bridge"
path = "src/main.rs"

# Test-only: Claude Code's wire, recorded and replayed (tests/claude.rs).
# The images build it with the package and copy only the bridge.
[[bin]]
name = "fake-claude"
path = "tests/support/fake_claude.rs"
test = false
doc = false

[dependencies]
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
hmac.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# BIP-340 for its doors (simplex/door.rs): the platform's curve and crate, at its pin
k256.workspace = true
# SIGTERM to a SimpleX core (simplex/run.rs): already in the lock, through tokio
libc = "0.2"
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
# Unicode's general categories, which SimpleX's core keeps a display name
# by (simplex/wire.rs, `valid_name`: its `mkValidName`, ported)
unicode-properties.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
