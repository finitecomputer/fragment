# SPIKE (branch spike/simplex-door, never merged): the SimpleX door's
# runner. One per door container: SimpleX's core beside it, its databases
# saved to the door's Durable Object after every change (cell/door.mjs).
[package]
name = "fragment-simplex-door"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# its own workspace: the computer images build the images workspace with
# only their own members copied in
[workspace]

[profile.release]
strip = true
overflow-checks = true

[[bin]]
name = "simplex-door"
path = "src/main.rs"

[dependencies]
fragment-bridge = { path = "../bridge" }
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio", "server"] }
libc = "0.2"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
webpki-roots = "1"
