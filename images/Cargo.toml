# The computer images' Rust (docs/computers.md): the bridge every image runs,
# and the Hermes image's boot tool. Its own workspace and lock, apart from the
# repo's root workspace, so an image's build context is `images/` alone and
# its dependencies are only these (no async runtime but tokio; TLS only for
# the bridge's fetch of a file Hermes sends by URL, rustls on ring with
# webpki's roots, as the root workspace's).
[workspace]
resolver = "2"
members = ["bridge", "hermes/boot"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio", "server"] }
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr"] }
# the SimpleX link page's QR code, drawn as SVG (bridge/src/simplex/http.rs):
# the crate finite-mono's agentd draws its SimpleX QR with, its renderer alone
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# general categories alone (unicode-rs): a SimpleX display name's rules.
# Pinned at Unicode 15.0.0's tables, the pinned core's own (its GHC's base:
# measured in the lab, which takes a 15.0 char and refuses a 15.1 one), so
# a char newer than the core's data is dropped as the core drops it; moving
# the core's pin moves this one (simplex/wire.rs asserts the version)
unicode-properties = { version = "=0.1.1", default-features = false, features = ["general-category"] }
webpki-roots = "1"

[profile.release]
strip = true
# Assertions stay on in release (docs/engineering-style.md, "Wear the
# seatbelt on the racetrack").
debug-assertions = false
overflow-checks = true
