<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
  <!-- the bars around the page take its own top colour, light or dark (shell.css --bg-sidebar) -->
  <meta name="theme-color" content="#ebe9e5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)">
  <!-- added to a home screen, it opens as an app: no browser bars (manifest's standalone; iOS reads these) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finite">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <!-- the release that answered this page, and when it was deployed,
       filled in as it is served (cell/src/shell.rs): its script reloads
       once the platform's answers name another (shell.js, "a new
       release"; docs/api.md, The shell), and Settings ends with both -->
  <meta name="fragment-release" content="{{release}}">
  <meta name="fragment-release-deployed" content="{{deployed}}">
  <title>Finite.Computer</title>
  <link rel="manifest" href="/__shell/manifest.webmanifest">
  <link rel="icon" href="/__shell/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/__shell/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Funnel Sans is the release's own (platform-pages.css, with the
       onboarding design's tokens and card); JetBrains Mono, Google's -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/__shell/platform-pages.css">
  <link rel="stylesheet" href="/__shell/shell.css">
</head>
<body>
  <!-- said only if the shell has drawn nothing after a while (one of its
       scripts never came, or their first answer: the page would be blank,
       with nothing to press), with a reload of this same page: shell.css
       shows it after a delay, and shell.js takes it away as it first draws
       the shell (firstRun, showLayout). No script of its own: it could fail
       to come as well. -->
  <p class="still-loading" id="still-loading">Still loading… <a href="">Reload</a></p>
  <!-- the shell: the platform's one page (docs/cloudflare-v1.md, decisions 6–12).
       sidebar | gutter | chat | gutter | viewer, one grid (layout.js). Design:
       Skyler's handoff, 2026-10-02. -->
  <div class="layout" id="layout" hidden>
    <div class="sidebar-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand" id="brand">Finite.Computer</div>
        <button class="icon-button sidebar-new-chat" id="sidebar-new-chat" type="button" title="Search or start a new chat" aria-label="Search or start a new chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="sidebar-agent-toolbar">
        <div id="primary-agent"></div>
      </div>
      <button class="row sidebar-start-chat" id="sidebar-start-chat" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a1 1 0 0 1 3 3l-9 9a2 2 0 0 1-.85.5l-2.87.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.85z"/></svg><span class="label">New chat</span></button>
      <!-- the invites waiting on the person's emails, each theirs to accept
           or decline (shell.js renderInvites; docs/api.md, Invites by email) -->
      <section class="invites" id="invites" aria-label="Invites" hidden></section>
      <nav class="rows" id="chats" aria-label="Chats"></nav>
      <div class="spacer"></div>
      <button class="row settings" id="settings" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="label">Settings</span></button>
    </aside>
    </div>
    <div class="gutter gutter-col" id="gutter-left" role="separator" aria-orientation="vertical" aria-label="Collapse or resize sidebar" title="Click to collapse · drag to resize"></div>

    <main class="chat">
      <header class="topbar">
        <div class="topbar-left">
        <button class="icon-button when-left-closed" id="toggle-left" type="button" title="Show sidebar (⌘B)" aria-label="Show sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>

        </div>
        <h1 class="chat-heading" id="chat-heading" hidden>
          <span class="title" id="chat-title"></span>
          <span class="offline-mark" id="offline" role="img" aria-label="Offline" data-tooltip="Lost connection" hidden></span>
        </h1>
        <strong class="page-title" id="page-title" hidden></strong>
        <div class="topbar-right">
        <!-- the shared launcher, using the open chat's agent -->
        <button class="icon-button" id="new-chat" type="button" title="Search or start a new chat" aria-label="Search or start a new chat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-button" id="chat-options" type="button" title="Chat options" aria-label="Chat options" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
        <button class="icon-button toggle-right" id="toggle-right" type="button" title="Toggle desktop (⌥⌘B)" aria-label="Toggle desktop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg><span class="badge" id="viewer-count" hidden></span></button>
        </div>
      </header>
      <!-- what the person should know of their computer, over every chat
           and settings (shell.js renderComputer; docs/computers.md, "What
           its owner is told") -->
      <div class="computer-notices" id="computer-notices" role="status" aria-live="polite" hidden></div>
      <!-- the shell's own notice (shell.js notice), above a chat or
           settings alike: never in #frames, which settings hide -->
      <div class="notice" id="notice"><strong>Loading…</strong></div>
      <div class="frames" id="frames">
        <p class="offline-note" id="offline-note" hidden>This chat loads when you're back online.</p>
      </div>
      <section class="page" id="settings-page" hidden></section>
    </main>

    <div class="gutter gutter-col" id="gutter-right" role="separator" aria-orientation="vertical" aria-label="Resize viewer" title="Drag to resize · double-click to reset"></div>
    <section class="viewer is-empty" id="viewer" aria-label="Viewer">
      <div class="wallpaper" aria-hidden="true"></div>
      <div class="stack" id="stack"></div>
      <!-- an empty desktop: what lands here, and a few real requests (shell.js renderDesktopEmpty) -->
      <div class="desktop-empty" id="desktop-empty" hidden></div>
      <div class="desktop-dock" aria-label="App dock">
        <nav id="apps" aria-label="Apps"></nav>
      </div>
    </section>
  </div>

  <!-- first run: sign in, the welcome (a seat), then the first agent
       (decision 10), as the platform's pages are (platform-pages.css:
       Skyler's onboarding design, 2026-10-22): Finite's logo, one card,
       and Finite's footer, its year shell.js's (firstRun) -->
  <main class="first-run" id="first-run" hidden>
    <div class="wallpaper" aria-hidden="true"></div>
    <div class="first-run-content">
      <div class="platform-brand"><img class="first-run-logo" src="/__shell/finite-logo.svg" alt="Finite" width="44" height="46"></div>
      <div class="first-run-card" id="first-run-card"></div>
      <footer class="page-footer">
        <span><span id="first-run-year"></span> © Finite Computer LLC</span>
        <nav aria-label="Finite">
          <a href="/about" target="_blank" rel="noopener">About</a>
          <a href="mailto:support@finite.computer">Contact</a>
          <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>
          <a href="/terms" target="_blank" rel="noopener">Terms</a>
        </nav>
      </footer>
    </div>
  </main>

  <div class="scrim" id="scrim"></div>
  <div class="menu" id="menu" role="menu" hidden></div>
  <!-- the platform's share sheet (/share/<name>), framed here: it is this origin's -->
  <dialog class="sheet" id="sheet"></dialog>
  <dialog class="rename-agent" id="rename-agent" aria-labelledby="rename-title">
    <form id="rename-form">
      <h2 id="rename-title">Name your agent</h2>
      <p>A name for what you’re working on together.</p>
      <label for="agent-name" id="rename-label">Agent name</label>
      <input id="agent-name" name="name" maxlength="48" required autocomplete="off">
      <p id="rename-error" class="form-error" role="alert" hidden></p>
      <div class="rename-actions"><button id="rename-cancel" type="button">Cancel</button><button type="submit">Save name</button></div>
    </form>
  </dialog>
  <!-- a page of the person's own asks to add one of their agents to its
       fragment: the shell asks them, here, never in the frame (docs/api.md, The shell) -->
  <dialog class="rename-agent" id="add-agent-dialog" aria-labelledby="add-agent-title" aria-describedby="add-agent-text">
    <form id="add-agent-form">
      <h2 id="add-agent-title">Add an agent?</h2>
      <p id="add-agent-text"></p>
      <div class="rename-actions"><button id="add-agent-cancel" type="button">Cancel</button><button type="submit" id="add-agent-go" disabled>Add</button></div>
    </form>
  </dialog>
  <dialog class="search-dialog" id="search-dialog" aria-label="Ask anything or find a chat">
    <div class="wallpaper" aria-hidden="true"></div>
    <div class="search-panel">
      <form class="search-input-wrap" id="search-form">
        <input id="workspace-search" type="text" aria-label="Ask anything or find a chat" placeholder="Ask anything, or find a chat or app…" autocomplete="off" maxlength="4000" enterkeyhint="send" autofocus aria-controls="search-results">
        <button class="icon-button search-send" id="search-send" type="submit" aria-label="Start a new chat" title="Start a new chat" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
      </form>
      <div class="search-results" id="search-results"></div>
      <p class="search-status" id="search-status" role="status"></p>
    </div>
  </dialog>
  <script type="module" src="/__shell/shell.js"></script>
</body>
</html>
