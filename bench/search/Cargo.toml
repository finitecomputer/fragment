[package]
name = "search-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Its own workspace and lock, as images/ is: LanceDB's tree (Arrow,
# DataFusion, Lance) stays out of the root workspace's build and CI.
[workspace]

[dependencies]
# 0.40.0 (0.41.0 is younger than the two-week dependency cooldown); its
# job.rs names an error variant only `remote` defines, so it builds only with it.
lancedb = { version = "=0.40.0", features = ["remote"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["json"] }
# The parser ureq itself uses, so the local-only check reads a URL as it does.
url = "2"
regex = "1"
# The route's merge itself (`fragment_core::across`), so the quality gate
# scores the code a question across fragments runs.
fragment-core = { path = "../../crates/core" }
fragment-proto = { path = "../../crates/proto" }

[profile.release]
debug-assertions = true
overflow-checks = true
